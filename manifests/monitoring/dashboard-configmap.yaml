apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-minha-app
  namespace: monitoring
  labels:
    grafana_dashboard: "1" # O sidecar do Grafana importa automaticamente este dashboard!
data:
  minha-app-dashboard.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Visão Geral da Aplicação (Minha-App)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red", "text": "DOWN" }, "1": { "color": "green", "text": "HEALTHY" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 1,
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "pluginVersion": "10.0.0",
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "max(up{app=~\"minha-app.*\"}) or vector(0)", "refId": "A" }
          ],
          "title": "Status da Aplicação",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisColorMode": "text", "drawStyle": "line", "lineInterpolation": "smooth", "lineWidth": 2 },
              "unit": "reqps"
            }
          },
          "gridPos": { "h": 4, "w": 9, "x": 6, "y": 1 },
          "id": 2,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(http_requests_total[1m])) by (path)", "legendFormat": "Rota {{path}}", "refId": "A" }
          ],
          "title": "Taxa de Requisições HTTP (req/s)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            }
          },
          "gridPos": { "h": 4, "w": 9, "x": 15, "y": 1 },
          "id": 3,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(http_requests_total) by (path)", "legendFormat": "{{path}}", "refId": "A" }
          ],
          "title": "Total Acumulado de Requisições",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 101,
          "title": "Recursos de Infraestrutura (Pods Minha-App)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "short"
            }
          },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 6 },
          "id": 4,
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(rate(container_cpu_usage_seconds_total{container=\"minha-app\"}[2m])) by (pod)", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "title": "Uso de CPU por Pod (Cores)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 6 },
          "id": 5,
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(container_memory_working_set_bytes{container=\"minha-app\"}) by (pod)", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "title": "Uso de Memória por Pod",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 12 },
          "id": 102,
          "title": "Logs em Tempo Real (Loki)",
          "type": "row"
        },
        {
          "datasource": { "type": "loki", "uid": "Loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 13 },
          "id": 6,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            { "datasource": { "type": "loki", "uid": "Loki" }, "editorMode": "code", "expr": "{namespace=\"default\"} |= \"minha-app\"", "queryType": "range", "refId": "A" }
          ],
          "title": "Últimos Logs da Aplicação (Loki Stream)",
          "type": "logs"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["poc", "minha-app", "devops"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "Minha-App - Métricas e Logs",
      "uid": "minha-app-observabilidade",
      "version": 1
    }
