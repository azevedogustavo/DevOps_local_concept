apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minha-app-monitor
  namespace: default
  labels:
    app: minha-app
    release: monitoring # Vincula o ServiceMonitor à release do Prometheus Operator
spec:
  selector:
    matchLabels:
      app: minha-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: minha-app-pod-monitor
  namespace: default
  labels:
    app: minha-app
    release: monitoring
spec:
  selector:
    matchLabels:
      app: minha-app
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
