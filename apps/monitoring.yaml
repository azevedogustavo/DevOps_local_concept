apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  sources:
    # Fonte 1: Chart oficial kube-prometheus-stack referenciando o arquivo de values do seu Git
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.1.1
      helm:
        valueFiles:
          - $values/manifests/monitoring/prometheus-values.yaml

    # Fonte 2: Seu repositório Git (alias "values")
    - repoURL: https://github.com/azevedogustavo/DevOps_local_concept.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Obrigatório para os CRDs grandes do Prometheus Operator
