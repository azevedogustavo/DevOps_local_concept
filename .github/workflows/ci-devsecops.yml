name: CI DevSecOps Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

env:
  #HARBOR_REGISTRY: harbor.local:8080
  HARBOR_REGISTRY: harbor-core.harbor.svc.cluster.local:80
  IMAGE_NAME: poc/minha-app
  APP_DIR: src/simpleApp

jobs:
  build-test-scan-push:
    runs-on: arc-runner-set
    permissions:
      contents: write # Necessário para o Step 9 fazer git push no repositório
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Necessário para análise completa do SonarQube

      # - name: 2. Executar Testes Unitários e Cobertura (via Docker)
      #   run: |
      #     docker run --rm -v "${{ github.workspace }}/${{ env.APP_DIR }}":/app -w /app golang:1.26-alpine sh -c "
      #       go mod init minha-app &&
      #       go mod tidy &&
      #       go test -v -coverprofile=coverage.out ./...
      #     "

      # - name: 3. Analise Estática (SonarQube)
      #   uses: SonarSource/sonarqube-scan-action@v4
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      #     LANG: C.UTF-8
      #     LC_ALL: C.UTF-8
      #     SONAR_SCANNER_OPTS: "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8"
      #   with:
      #     args: >
      #       -Dsonar.projectKey=minha-app
      #       -Dsonar.sources=${{ env.APP_DIR }}
      #       -Dsonar.exclusions=**/*_test.go,**/*.md,**/*.yaml,**/*.yml,**/Dockerfile,**/*.sh
      #       -Dsonar.tests=${{ env.APP_DIR }}
      #       -Dsonar.test.inclusions=**/*_test.go
      #       -Dsonar.go.coverage.reportPaths=${{ env.APP_DIR }}/coverage.out

      # - name: 4. Limpar arquivos temporários do teste antes do Docker Build
      #   run: |
      #     rm -f "${{ env.APP_DIR }}/go.mod" "${{ env.APP_DIR }}/go.sum" "${{ env.APP_DIR }}/coverage.out"

      - name: 5. Build da Imagem Docker
        run: |
          IMAGE_TAG="${HARBOR_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::7}"
          docker build -t "${IMAGE_TAG}" ./${{ env.APP_DIR }}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      # - name: 6. Scan de Vulnerabilidades na Imagem (Trivy)
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     image-ref: ${{ env.IMAGE_TAG }}
      #     format: 'table'
      #     exit-code: '1' # Falha o pipeline se encontrar vulnerabilidades críticas/altas
      #     ignore-unfixed: true
      #     severity: 'CRITICAL,HIGH'
      #     insecure: true

      - name: 7. Login e Push no Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_USER: ${{ secrets.HARBOR_PUSH_USER }}
          REGISTRY_PASS: ${{ secrets.HARBOR_PUSH_PASSWORD }}
        run: |
          #docker info | grep -A 5 "Insecure Registries:"
          printf '%s' "$REGISTRY_PASS" | docker login "${HARBOR_REGISTRY}" -u "$REGISTRY_USER" --password-stdin
          docker push "${IMAGE_TAG}"
          docker tag "${IMAGE_TAG}" "${HARBOR_REGISTRY}/${IMAGE_NAME}:latest"
          docker push "${HARBOR_REGISTRY}/${IMAGE_NAME}:latest"


      - name: 8. Instalar Cosign e Assinar Imagem no Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.8.1

      - name: 9. Assinar Imagem com Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_TAG}")
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          cosign sign --key cosign.key --allow-insecure-registry --yes "${IMAGE_DIGEST}"
          rm -f cosign.key

      - name: 10. Atualizar Tag da Imagem para o ArgoCD
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git pull origin main --rebase
          sed -i "s|tag: .*|tag: \"${GITHUB_SHA::7}\"|" charts/minha-app/values.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add charts/minha-app/values.yaml
          if ! git diff --staged --quiet; then
            git commit -m "chore(cd): update image tag to ${GITHUB_SHA::7} [skip ci]"
            git push origin main
          fi

